<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Government Scheme Eligibility Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #222; }
    h2 { color: #1F4E79; }
    label { display: block; margin-bottom: 14px; }
    input { padding: 6px; width: 260px; }
    button { padding: 8px 18px; background: #1F4E79; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 10px 16px; margin: 12px 0; }
    .muted { color: #666; font-size: 13px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h2>Check Your Eligible Schemes</h2>
  <form id="eligibilityForm">
    <label>Age: <input type="number" id="age" required></label>
    <label>Annual Income (Rs): <input type="number" id="income" required></label>
    <label>Occupation: <input type="text" id="occupation" placeholder="farmer / student / labourer / other" required></label>
    <label>Gender: <input type="text" id="gender" placeholder="male / female"></label>
    <button type="submit">Check Eligibility</button>
  </form>

  <div id="results"></div>

  <script>
    // The API runs on the same Vercel site (serverless function). No separate server needed.
    const API_URL = "/api/check-eligibility";

    document.getElementById('eligibilityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p class="muted">Checking...</p>';

      const body = {
        age: Number(document.getElementById('age').value),
        income: Number(document.getElementById('income').value),
        occupation: document.getElementById('occupation').value,
        gender: document.getElementById('gender').value,
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');

        let html = '<h3>Eligible Schemes: ' + data.totalEligible + '</h3>' +
                   '<p class="muted">' + data.engine + '</p>';

        data.schemes.forEach((scheme) => {
          const ml = scheme.mlConfidence === null
            ? ''
            : '<p><b>ML confidence:</b> ' + scheme.mlConfidence + '%</p>';
          html +=
            '<div class="card">' +
              '<h4>' + scheme.name + '</h4>' +
              '<p><b>Category:</b> ' + scheme.category + '</p>' +
              '<p>' + scheme.description + '</p>' +
              '<p><b>Why eligible:</b> ' + scheme.reason + '</p>' +
              '<p><b>Documents needed:</b> ' + scheme.documents.join(', ') + '</p>' +
              ml +
            '</div>';
        });
        resultsDiv.innerHTML = html;
      } catch (err) {
        resultsDiv.innerHTML = '<p class="error">Could not get results: ' + err.message + '</p>';
      }
    });
  </script>
</body>
</html>
